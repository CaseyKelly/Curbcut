# The worker on Fly.io (#5). Deploy from the repo root, which is the build context:
#   fly deploy --config apps/worker/fly.toml
# Secrets: fly secrets set DATABASE_URL=... --config apps/worker/fly.toml
app = 'curbcut-worker'
primary_region = 'iad'
# SIGINT then up to 2 minutes for the job in hand to finish before the machine is killed.
kill_signal = 'SIGINT'
kill_timeout = '120s'

[build]
  dockerfile = 'Dockerfile'

[env]
  NODE_ENV = 'production'
  PORT = '8080'

# The worker serves nothing publicly, so there is no [http_service]. This
# machine check is what Fly uses to tell a stuck worker from a healthy one.
[checks.health]
  type = 'http'
  port = 8080
  path = '/healthz'
  interval = '30s'
  timeout = '5s'
  grace_period = '30s'

# Chromium needs the memory.
[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
