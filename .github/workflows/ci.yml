name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # Throwaway database: migrated below, then used by the integration tests.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: curbcut
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/curbcut
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Migrations match the schema
        run: |
          npm run db:generate
          if [ -n "$(git status --porcelain packages/db/drizzle)" ]; then
            echo "::error::packages/db/src/schema.ts changed without a migration. Run npm run db:generate and commit the result."
            git status --porcelain packages/db/drizzle
            exit 1
          fi
      # The drift check compares schema.ts with the snapshot, not the SQL that
      # runs, so a hand-edited migration would slip past it. Migrations on the
      # base branch may have been applied somewhere: change the schema and
      # generate a new one instead.
      - name: Committed migrations are unchanged
        if: github.event_name == 'pull_request'
        run: |
          git fetch --depth=1 origin "$GITHUB_BASE_REF"
          changed=$(git diff --name-only --diff-filter=MD FETCH_HEAD HEAD -- 'packages/db/drizzle/*.sql' 'packages/db/drizzle/meta/*_snapshot.json')
          if [ -n "$changed" ]; then
            echo "::error::Committed migrations were edited or deleted. Generate a new migration instead."
            echo "$changed"
            exit 1
          fi
      - run: npm run db:migrate

      # Chromium, for the worker's scanner tests and the sample-site scan.
      # Cached per Playwright version. The system libraries live outside the
      # cache, so install them on a hit too.
      - id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - run: npm run check
      - run: npm run scan:sample-site

  # The worker image must keep building (#5). Built, not pushed: deploys go
  # through `fly deploy`.
  worker-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/worker/Dockerfile -t curbcut-worker .
