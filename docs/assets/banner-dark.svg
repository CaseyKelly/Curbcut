<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t">
  <title id="t">Curbcut: find accessibility bugs, understand them, and fix them in a pull request you approve.</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#151f38"/></linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
    <pattern id="paving" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="11" cy="11" r="4.5" fill="#93c5fd"/></pattern>
    <linearGradient id="fade" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity="1"/></linearGradient>
    <mask id="m"><rect x="760" y="0" width="440" height="300" fill="url(#fade)"/></mask>
  </defs>
  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
  <rect x="760" y="0" width="440" height="300" fill="url(#paving)" opacity="0.22" mask="url(#m)"/>
  <g transform="translate(80 70)">
    <rect width="160" height="160" rx="38" fill="url(#mark)"/>
    <path d="M24 52 H62 L112 104 H138 V134 H24 Z" fill="#fff"/>
    <g fill="#facc15">
      <circle cx="72" cy="62.4" r="5"/><circle cx="82" cy="72.8" r="5"/><circle cx="92" cy="83.2" r="5"/><circle cx="102" cy="93.6" r="5"/>
    </g>
  </g>
  <text x="280" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="88" font-weight="800" letter-spacing="-2" fill="#f8fafc">Curbcut</text>
  <text x="284" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#cbd5e1">Find accessibility bugs. Understand them. Fix them in a PR you approve.</text>
  <text x="284" y="238" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="17" fill="#93c5fd">scan  →  explain  →  map  →  propose  →  you review  →  ship  →  verify</text>
